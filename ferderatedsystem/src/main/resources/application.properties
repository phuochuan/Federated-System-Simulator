spring.application.name=minifls
server.address=127.0.0.1
server.port=${MINIFLS_SERVER_PORT:8080}
minifls.worker-url=${MINIFLS_WORKER_URL:http://127.0.0.1:8000}
minifls.worker.max-attempts=${MINIFLS_WORKER_MAX_ATTEMPTS:4}
minifls.worker.retry-delay-ms=${MINIFLS_WORKER_RETRY_DELAY_MS:2000}
minifls.worker.retry-max-delay-ms=${MINIFLS_WORKER_RETRY_MAX_DELAY_MS:30000}
minifls.worker.request-timeout-seconds=${MINIFLS_WORKER_REQUEST_TIMEOUT_SECONDS:1800}
spring.datasource.url=jdbc:sqlite:${MINIFLS_DATABASE:../artifacts/minifls.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=always
logging.level.com.huanphan.ferderatedsystem=${MINIFLS_LOG_LEVEL:INFO}

# Optional experiment launch from FerderatedsystemApplication (disabled by default).
minifls.launch.method=${MINIFLS_METHOD:none}
minifls.launch.enabled=${MINIFLS_LAUNCH_ENABLED:true}
minifls.launch.workspace=${MINIFLS_WORKSPACE:}
minifls.launch.config=${MINIFLS_CONFIG:}
minifls.launch.experiment-id=${MINIFLS_EXPERIMENT_ID:}
minifls.launch.manifest=${MINIFLS_MANIFEST:}
minifls.launch.selection=${MINIFLS_SELECTION:}
minifls.launch.rounds=${MINIFLS_ROUNDS:}
minifls.launch.seed=${MINIFLS_SEED:}

# Controlled experiment matrix: set MINIFLS_METHOD=matrix to run all three comparisons.
minifls.matrix.config=${MINIFLS_MATRIX_CONFIG:configurations/controlled-matrix.json}
minifls.matrix.rounds=${MINIFLS_MATRIX_ROUNDS:}
minifls.fuzzy.matrix.config=${MINIFLS_FUZZY_MATRIX_CONFIG:configurations/fuzzy-matrix.json}
minifls.lambda.matrix.config=${MINIFLS_LAMBDA_MATRIX_CONFIG:configurations/lambda-ablation.json}
minifls.audit.config=${MINIFLS_AUDIT_CONFIG:configurations/reproducibility-audit.json}
minifls.matched.config=${MINIFLS_MATCHED_CONFIG:configurations/fairness-matched-lambda.json}
minifls.audit.output=${MINIFLS_AUDIT_OUTPUT:}
minifls.matched.output=${MINIFLS_MATCHED_OUTPUT:}
minifls.pareto.config=${MINIFLS_PARETO_CONFIG:configurations/pareto-tradeoff.json}
minifls.pareto.output=${MINIFLS_PARETO_OUTPUT:artifacts/research/pareto-tradeoff}
# Use a new output directory when changing protocol or Java/Python runtime.
# MINIFLS_RESEARCH_OUTPUT is read by ResearchExperiments only when explicitly set.

minifls.worker.recovery-budget-seconds=${MINIFLS_WORKER_RECOVERY_BUDGET_SECONDS:7200}
minifls.worker.retry-jitter=${MINIFLS_WORKER_RETRY_JITTER:0}
