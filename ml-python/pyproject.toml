[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minifls-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "scikit-learn>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "simpy==4.1.2", "pyyaml>=6,<7", "psutil>=6,<8", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["minifls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
